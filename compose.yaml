name: bbf

x-app: &app
  build: tools/docker
  working_dir: /app
  volumes:
    - .:/app
  environment:
    NUXT_BEZOAR_DRIVER: pg
    NUXT_BEZOAR_URL: postgres://postgres:postgres@db:5432/bbf
  depends_on:
    db:
      condition: service_healthy
  init: true

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bbf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bbf"]
      interval: 2s
      timeout: 5s
      retries: 30

  web:
    <<: *app
    command: pnpm --filter @bbf/web dev --host 0.0.0.0
    ports:
      - "3000:3000"

  admin:
    <<: *app
    command: pnpm --filter @bbf/admin dev --host 0.0.0.0
    ports:
      - "3001:3001"
    env_file:
      - path: apps/admin/.env
        required: false

volumes:
  pgdata:
