name: Preview

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

concurrency:
  group: preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    # Fork PRs get no secrets.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'preview')
      )
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Use the branch commit, not the merge commit. Vercel attributes the deployment to it.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/package.json
          cache: pnpm
      - uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        continue-on-error: true
        with:
          team: ${{ vars.TURBO_TEAM }}
      - name: Pull project settings
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: npx vercel@50 pull --yes --environment=preview --git-branch="$BRANCH" --token="$VERCEL_TOKEN"
      - name: Build
        run: npx vercel@50 build --token="$VERCEL_TOKEN"
      - name: Deploy
        id: deploy
        run: |
          url=$(npx vercel@50 deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "Preview deployed for ${{ github.event.pull_request.head.sha }}: ${{ steps.deploy.outputs.url }}"
