name: Preview

# Preview deployments are opt-in. Vercel's Git integration only deploys
# `main` (see apps/web/vercel.json); a PR gets a preview when it carries the
# `preview` label, and keeps getting one for each push while the label stays.
on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

# One preview build per branch at a time; a newer push wins.
concurrency:
  group: preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    # Manual runs always deploy. PR events deploy only when the PR is
    # labelled `preview` and comes from this repo (a fork gets no token).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'preview')
      )
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch's own commit, not the PR's merge commit, so Vercel
          # attributes the deployment to the branch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # The version Vercel deploys on: `engines.node` of the app, the Root Directory.
          node-version-file: apps/web/package.json
          cache: pnpm
      # Short-lived token for the Vercel Remote Cache, so the build reuses
      # what CI and production already built.
      - uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        continue-on-error: true
        with:
          team: ${{ vars.TURBO_TEAM }}
      - name: Pull project settings
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: npx vercel@50 pull --yes --environment=preview --git-branch="$BRANCH" --token="$VERCEL_TOKEN"
      - name: Build
        run: npx vercel@50 build --token="$VERCEL_TOKEN"
      - name: Deploy
        id: deploy
        run: |
          url=$(npx vercel@50 deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "Preview deployed for ${{ github.event.pull_request.head.sha }}: ${{ steps.deploy.outputs.url }}"
