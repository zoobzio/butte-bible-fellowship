name: Translate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: translate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  translate:
    name: Translate
    runs-on: ubuntu-latest
    # Fork PRs get no secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the branch, not the merge commit. The job pushes back to it.
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bbf/prose translate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit translations
        run: |
          git add packages/prose/.cache
          if git diff --cached --quiet; then
            echo "Translations are up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update translations"
          git pull --rebase
          git push
