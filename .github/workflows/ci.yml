name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # The version Vercel deploys on: `engines.node` of the app, the Root Directory.
          node-version-file: apps/web/package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # The version Vercel deploys on: `engines.node` of the app, the Root Directory.
          node-version-file: apps/web/package.json
          cache: pnpm
      # Short-lived token for the Vercel Remote Cache, so CI shares one cache
      # with Vercel deployments. Without a token (a fork's PR, no OIDC policy
      # yet) turbo still runs, with the local cache only.
      - uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        continue-on-error: true
        with:
          team: ${{ vars.TURBO_TEAM }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # The version Vercel deploys on: `engines.node` of the app, the Root Directory.
          node-version-file: apps/web/package.json
          cache: pnpm
      # Short-lived token for the Vercel Remote Cache, so CI shares one cache
      # with Vercel deployments. Without a token (a fork's PR, no OIDC policy
      # yet) turbo still runs, with the local cache only.
      - uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        continue-on-error: true
        with:
          team: ${{ vars.TURBO_TEAM }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - run: echo "All checks passed"
